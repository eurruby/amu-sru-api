name = "amu-sru-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
SRU_URL = "https://catalogue.univ-amu.fr/biblios"
OPAC_URL = "https://catalogue.univ-amu.fr/cgi-bin/koha/opac-detail.pl"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
